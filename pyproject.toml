[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mechpulse"
version = "1.0.0"
description = "Real-Time Vibration Monitoring & Predictive Maintenance for Industrial Plants"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "MechPulse Team"}]
keywords = ["vibration", "predictive-maintenance", "industry-4.0", "fft", "iso-10816", "condition-monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "PySide6>=6.5.0",
    "pyqtgraph>=0.13.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy"]

[project.scripts]
mechpulse = "mechpulse.ui.app:main"

[project.urls]
Homepage = "https://github.com/mechpulse/mechpulse"
Repository = "https://github.com/mechpulse/mechpulse"
Changelog = "https://github.com/mechpulse/mechpulse/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
